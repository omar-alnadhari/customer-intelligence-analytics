name: Reproduce pipeline and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up verified Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download verified UCI source archive
        run: |
          mkdir -p data/raw
          curl --fail --location \
            "https://archive.ics.uci.edu/static/public/502/online%2Bretail%2Bii.zip" \
            --output "data/raw/online+retail+ii.zip"

      - name: Reproduce the complete pipeline
        run: python run_pipeline.py

      - name: Run automated integrity tests
        run: python -m pytest -q
